{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab-autodoc.server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-autodoc.server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "homelab-autodoc.server.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: {{ .Values.server.service.port }}
{{- end }}
