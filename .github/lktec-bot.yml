# Policy of the lktec-bot GitHub App for this repository. Committed to the default branch: the
# bot reads it from there, never from a pull request. See docs/modules/automerge.md in
# lukislp/lktec-bot for every key.
version: 1
modules:
  automerge:
    enabled: true
    # patch, minor and digest updates are armed; manual leaves majors to a person.
    majors: manual
    # auto arms a pull request that changes .github/workflows/; manual leaves it to a person.
    workflow-files: auto
    # How GitHub merges once the checks are green.
    method: squash
    # Dependency names (exact, case-insensitive) that are never approved or armed.
    exclude: []

  # Commits the image tag bump of the deploy manifests onto the default branch after a release (see
  # docs/modules/sync.md in lukislp/lktec-bot). The App is a bypass actor of the branch ruleset for it.
  sync:
    enabled: true
    paths: [k8s]
    branch: master
    commit-message: "chore(deploy): image {version} [skip ci]"

  # Tags and publishes a release from the Conventional Commits on the default branch (see
  # docs/modules/release.md in lukislp/lktec-bot).
  release:
    enabled: true
    mode: tag
    tag-format: "v{version}"
    branch: master          # the default branch
    first-version: "1.0.0"  # only used while no tag matches tag-format
    rules: []               # no custom release rules before the move
