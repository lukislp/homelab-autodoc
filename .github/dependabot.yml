# Weekly Dependabot updates: GitHub Actions, the frontend (dev deps grouped), the four Python packages and both Dockerfiles.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(ci)"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: pip
    directories:
      - /collector
      - /core
      - /generator
      - /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: docker
    directories:
      - /collector
      - /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(docker)"
