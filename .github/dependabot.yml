# Weekly Dependabot updates: GitHub Actions, the frontend (dev deps grouped), the four Python packages and both Dockerfiles.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(ci)"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: pip
    directories:
      - /collector
      - /core
      - /generator
      - /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: docker
    directories:
      - /collector
      - /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(docker)"
    # Base image major bumps are handled deliberately, not via Dependabot.
    # Dependabot classifies 3.12 -> 3.14 as a minor bump for python's
    # versioning scheme, so both semver-minor and semver-major are ignored
    # for python; patch updates keep flowing. node only needs semver-major
    # ignored since its versioning is already major-based.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
