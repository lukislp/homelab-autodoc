# Weekly Dependabot updates: GitHub Actions, the frontend (React and dev deps each grouped),
# the four Python packages and both Dockerfiles.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # React and react-dom must move together: React refuses to start when the two resolve to
      # different versions ("Incompatible React versions ... must have the exact same version"),
      # so a PR bumping one alone fails its own tests until the other arrives. That is what
      # happened to #157. The @types packages ride along so the types never describe a version
      # that is not installed.
      #
      # Listed BEFORE "dev" on purpose: a dependency joins the first group it matches, and both
      # @types packages are devDependencies - "dev" would otherwise claim them and split the set
      # again. Exact names rather than a react* pattern, because @testing-library/react and
      # @vitejs/plugin-react are unrelated to that lockstep and should keep updating on their own.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
  - package-ecosystem: pip
    directories:
      - /collector
      - /core
      - /generator
      - /server
      # pip-compile outputs (hash-locked); Dependabot rewrites hashes along with versions.
      - /requirements
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
  - package-ecosystem: docker
    directories:
      - /collector
      - /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(docker)"
    # Base image major bumps are handled deliberately, not via Dependabot.
    # Dependabot classifies 3.12 -> 3.14 as a minor bump for python's
    # versioning scheme, so both semver-minor and semver-major are ignored
    # for python; patch updates keep flowing. node only needs semver-major
    # ignored since its versioning is already major-based.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "lukislp"
