name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  test-lint:
    strategy:
      matrix:
        package: [core, collector, generator, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
        working-directory: ${{ matrix.package }}
      - run: ruff format --check .
        working-directory: ${{ matrix.package }}

  test-unit:
    strategy:
      matrix:
        package: [core, collector, generator, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - if: matrix.package != 'core'
        run: pip install -e core
      - if: matrix.package == 'server'
        run: pip install -e generator
      - run: pip install -e "${{ matrix.package }}[dev]"
      - run: >
          python -m pytest --cov=autodoc_${{ matrix.package }}
          --cov-report=json:coverage.json
        working-directory: ${{ matrix.package }}
      - run: >
          python3 ../scripts/generate_coverage_badge.py coverage.json coverage-badge.json
          ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-badge-${{ matrix.package }}
          path: ${{ matrix.package }}/coverage-badge.json
          retention-days: 7

  test-frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # tsc -b runs as part of the build - no separate typecheck step needed.
      - run: npm run build
        working-directory: frontend

  test-frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      # vitest's coverage-summary.json has a different shape than coverage.py's -
      # reshape just the number the badge script needs, same script for every package.
      - run: |
          python3 -c "
          import json
          pct = json.load(open('coverage/coverage-summary.json'))['total']['lines']['pct']
          json.dump({'totals': {'percent_covered': pct}}, open('coverage-for-badge.json', 'w'))
          "
        working-directory: frontend
      - run: python3 ../scripts/generate_coverage_badge.py coverage-for-badge.json coverage-badge.json frontend
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-badge-frontend
          path: frontend/coverage-badge.json
          retention-days: 7

  # ---------------------------------------------------------------------
  # Version / release — push to master only
  # ---------------------------------------------------------------------
  get-version:
    needs: [test-lint, test-unit, test-frontend-lint, test-frontend-unit]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # @semantic-release/github's verifyConditions checks repo push access even during a dry
    # run, so contents: write is required here too.
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@6.0.3
            @semantic-release/github@12.0.9
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - expected, not a failure." | tee -a "$GITHUB_STEP_SUMMARY"

  semantic-release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-badge-*
          path: coverage-artifacts
      - run: |
          mkdir -p .github/badges
          for pkg in core collector generator server frontend; do
            mv "coverage-artifacts/coverage-badge-$pkg/coverage-badge.json" ".github/badges/coverage-$pkg.json"
          done
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@6.0.3
            @semantic-release/github@12.0.9
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
