name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

permissions:
  contents: read
  # The reusable release workflow resolves its own commit through the Actions API.
  actions: read

jobs:
  test-lint:
    strategy:
      matrix:
        package: [core, collector, generator, server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --require-hashes -r requirements/lint.txt
      - run: ruff check .
        working-directory: ${{ matrix.package }}
      - run: ruff format --check .
        working-directory: ${{ matrix.package }}

  test-unit:
    strategy:
      matrix:
        package: [core, collector, generator, server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/${{ matrix.package }}*.txt
      # Third-party dependencies from the hash-locked requirements/ files (runtime lock +
      # the package's [dev] extra), then the local packages themselves without resolution.
      - run: pip install --require-hashes -r requirements/${{ matrix.package }}.txt -r requirements/${{ matrix.package }}-dev.txt
      - if: matrix.package != 'core'
        run: pip install --no-deps -e core
      - if: matrix.package == 'server'
        run: pip install --no-deps -e generator
      - run: pip install --no-deps -e "${{ matrix.package }}"
      - run: >
          python -m pytest --cov=autodoc_${{ matrix.package }}
          --cov-report=json:coverage.json
        working-directory: ${{ matrix.package }}
      - run: >
          python3 ../scripts/generate_coverage_badge.py coverage.json coverage-badge.json
          ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
      - name: Hand the coverage badge over for the bot commit
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/badge-handover/files/.github/badges"
          cp ${{ matrix.package }}/coverage-badge.json "$RUNNER_TEMP/badge-handover/files/.github/badges/coverage-${{ matrix.package }}.json"
          printf '%s\n' .github/badges/coverage-${{ matrix.package }}.json > "$RUNNER_TEMP/badge-handover/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge-handover-${{ matrix.package }}
          path: ${{ runner.temp }}/badge-handover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Coverage-guided fuzzing of core's inventory (de)serialization and diff (core/fuzz/): a
  # short fixed budget per run, enough to catch a crash on the next code change.
  fuzz-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --require-hashes -r requirements/core.txt -r requirements/core-fuzz.txt
      - run: pip install --no-deps -e core
      - run: python core/fuzz/fuzz_serialize.py -max_total_time=30 -rss_limit_mb=1024

  test-frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # tsc -b runs as part of the build - no separate typecheck step needed.
      - run: npm run build
        working-directory: frontend

  test-helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/homelab-autodoc
      - name: Template every combination of optional features
        run: |
          set -e
          helm template t charts/homelab-autodoc -n homelab-autodoc \
            --set server.existingSecret=x > /dev/null
          helm template t charts/homelab-autodoc -n homelab-autodoc \
            --set server.existingSecret=x \
            --set server.ingress.enabled=true \
            --set server.networkPolicy.enabled=true \
            --set collector.networkPolicy.enabled=true \
            --set server.updateStrategy=RollingUpdate \
            --set server.storage.data.accessModes[0]=ReadWriteMany > /dev/null
          helm template t charts/homelab-autodoc -n homelab-autodoc \
            --set server.existingSecret=x \
            --set server.gatewayApi.enabled=true \
            --set server.gatewayApi.parentRef.name=my-gw \
            --set server.gatewayApi.parentRef.namespace=gw-ns > /dev/null
          helm template t charts/homelab-autodoc -n homelab-autodoc \
            --set server.enabled=false \
            --set collector.pushUrl=http://autodoc-server.other.svc:8000 > /dev/null
      - name: Fail-fast guards raise a clear error
        run: |
          set -e
          out=$(helm template t charts/homelab-autodoc -n homelab-autodoc 2>&1) && { echo "expected server.existingSecret guard did not fire"; exit 1; }
          echo "$out" | grep -q "server.existingSecret is required"
          out=$(helm template t charts/homelab-autodoc -n homelab-autodoc --set server.existingSecret=x --set server.enabled=false 2>&1) && { echo "expected collector.pushUrl guard did not fire"; exit 1; }
          echo "$out" | grep -q "collector.pushUrl is required"

  test-frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      # vitest's coverage-summary.json has a different shape than coverage.py's -
      # reshape just the number the badge script needs, same script for every package.
      - run: |
          python3 -c "
          import json
          pct = json.load(open('coverage/coverage-summary.json'))['total']['lines']['pct']
          json.dump({'totals': {'percent_covered': pct}}, open('coverage-for-badge.json', 'w'))
          "
        working-directory: frontend
      - run: python3 ../scripts/generate_coverage_badge.py coverage-for-badge.json coverage-badge.json frontend
        working-directory: frontend
      - name: Hand the coverage badge over for the bot commit
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/badge-handover/files/.github/badges"
          cp frontend/coverage-badge.json "$RUNNER_TEMP/badge-handover/files/.github/badges/coverage-frontend.json"
          printf '%s\n' .github/badges/coverage-frontend.json > "$RUNNER_TEMP/badge-handover/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge-handover-frontend
          path: ${{ runner.temp }}/badge-handover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------
  # Version / docker / release — push to master only
  # ---------------------------------------------------------------------
  get-version:
    needs: [test-lint, test-unit, test-frontend-lint, test-frontend-unit, test-helm-lint]
    if: github.event_name == 'push'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@f1dbc56e0810b5f78691019889fc76cf5423d7fa # v0.3.0
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # Tags and publishes the GitHub Release through the lktec-bot App (the rules live in
  # .github/lktec-bot.yml). The tag carries no signature; the images below are signed (Sigstore).
  release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@f1dbc56e0810b5f78691019889fc76cf5423d7fa # v0.3.0
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  docker-smoke-check:
    # Runs after the release job created the tag, same as the docker jobs below.
    # collector has no HTTP surface at all (a CLI, not a service)
    # - "smoke-check" there just means the image runs and the entry point works.
    needs: [get-version, release]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [collector, server]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          load: true
          tags: homelab-autodoc-${{ matrix.image }}:smoke-check
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
      - name: Smoke-check collector
        if: matrix.image == 'collector'
        run: docker run --rm homelab-autodoc-collector:smoke-check --version
      - name: Smoke-check server
        if: matrix.image == 'server'
        run: |
          docker run -d --name server-smoke -p 8000:8000 -e AUTODOC_SESSION_SECRET=smoke-check homelab-autodoc-server:smoke-check
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "container is healthy"
              docker rm -f server-smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy in time"
          docker logs server-smoke
          docker rm -f server-smoke
          exit 1

  docker-build-push:
    # One native runner per platform instead of a single QEMU-emulated multi-platform build -
    # ubuntu-24.04-arm is a real arm64 GitHub-hosted runner (free for public repos), so that
    # leg builds at native speed. Each leg pushes its own image by digest only (no tag yet);
    # docker-manifest-merge below stitches the two digests per image into the actual
    # multi-arch :latest/:$NEXT_VERSION tags.
    needs: [get-version, release, docker-smoke-check]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        image: [collector, server]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
      IMAGE: ghcr.io/lukislp/homelab-autodoc-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          # Supply chain (2026-09-11 hardening): BuildKit attaches a SLSA provenance attestation
          # (which commit/workflow built this, from which base image) and an SPDX SBOM to every
          # per-arch image. They travel as extra "unknown/unknown" platform entries inside the
          # pushed index - GHCR shows them as such, containerd/k3s ignore them when pulling,
          # Trivy resolves the real linux/amd64 entry. imagetools create below carries them into
          # the multi-arch manifest unchanged.
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    needs: [get-version, docker-build-push]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        image: [collector, server]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # OIDC token for Sigstore keyless signing (cosign sign below) - no key material anywhere.
      id-token: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
      IMAGE: ghcr.io/lukislp/homelab-autodoc-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"
      # Sigstore keyless signature on the multi-arch manifest DIGEST (2026-09-11 hardening), so
      # every tag pointing at it (version, latest, sha-) is covered by one signature. The
      # signing identity is this workflow's OIDC certificate (repo + workflow path + ref), the
      # signature and the transparency-log entry live next to the image in GHCR. The verify
      # step right after is the live proof for this run and the exact identity constraint Flux
      # will use once its ImagePolicy verification is switched on (cluster phase).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the multi-arch manifest (Sigstore keyless) and verify
        env:
          IDENTITY_REGEXP: '^https://github\.com/lukislp/homelab-autodoc/\.github/workflows/ci-cd\.yml@refs/heads/master$'
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE }}@${DIGEST}" --output text >/dev/null
          echo "signed and verified ${{ env.IMAGE }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  # One handover for the five coverage badges (each test job uploads its own); the deploy-bump job commits
  # it together with the image bump.
  badge-handover:
    needs: [get-version, test-unit, test-frontend-unit]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/badge-in
          pattern: coverage-badge-handover-*
      - name: Combine the handovers
        run: |
          set -eu
          out="$RUNNER_TEMP/badge-handover"
          mkdir -p "$out/files"
          : > "$out/manifest.txt"
          for d in "$RUNNER_TEMP"/badge-in/*/; do
            cp -r "${d}files/." "$out/files/"
            cat "${d}manifest.txt" >> "$out/manifest.txt"
          done
          test "$(wc -l < "$out/manifest.txt")" -eq 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge-handover
          path: ${{ runner.temp }}/badge-handover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  # The image tag bump of the deploy manifests, committed onto the default branch by the lktec-bot App
  # (module sync: docs/modules/sync.md in lukislp/lktec-bot; the App is a bypass actor of the branch ruleset
  # for this one commit, which GitHub signs itself; the coverage badges ride along in it). Flux picks the new tag up from the branch.
  deploy-bump:
    needs: [get-version, release, docker-manifest-merge, trivy-scan, badge-handover]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    concurrency:
      group: homelab-autodoc-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/deploy-bump.yml@f1dbc56e0810b5f78691019889fc76cf5423d7fa # v0.3.0
    with:
      version: ${{ needs.release.outputs.version }}
      images: 'ghcr\.io/lukislp/(homelab-autodoc-collector|homelab-autodoc-server)'
      paths: k8s
      branch: master
      handover-artifact: coverage-badge-handover
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  trivy-scan:
    needs: [get-version, docker-manifest-merge]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [collector, server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
      IMAGE: ghcr.io/lukislp/homelab-autodoc-${{ matrix.image }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Gate on CRITICAL
        # A CRITICAL finding with an available fix blocks the rollout (deploy-bump needs this job);
        # unfixed ones are reported above but cannot be acted on yet.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
