name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  test-lint:
    strategy:
      matrix:
        package: [core, collector, generator, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
        working-directory: ${{ matrix.package }}
      - run: ruff format --check .
        working-directory: ${{ matrix.package }}

  test-unit:
    strategy:
      matrix:
        package: [core, collector, generator, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - if: matrix.package != 'core'
        run: pip install -e core
      - if: matrix.package == 'server'
        run: pip install -e generator
      - run: pip install -e "${{ matrix.package }}[dev]"
      - run: >
          python -m pytest --cov=autodoc_${{ matrix.package }}
          --cov-report=json:coverage.json
        working-directory: ${{ matrix.package }}
      - run: >
          python3 ../scripts/generate_coverage_badge.py coverage.json coverage-badge.json
          ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-badge-${{ matrix.package }}
          path: ${{ matrix.package }}/coverage-badge.json
          retention-days: 7

  test-frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # tsc -b runs as part of the build - no separate typecheck step needed.
      - run: npm run build
        working-directory: frontend

  test-helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/homelab-autodoc
      - name: Template every combination of optional features
        run: |
          set -e
          helm template t charts/homelab-autodoc -n homelab-autodoc \
            --set server.existingSecret=x > /dev/null
          helm template t charts/homelab-autodoc -n homelab-autodoc \
            --set server.existingSecret=x \
            --set server.ingress.enabled=true \
            --set server.networkPolicy.enabled=true \
            --set collector.networkPolicy.enabled=true \
            --set server.updateStrategy=RollingUpdate \
            --set server.storage.data.accessModes[0]=ReadWriteMany > /dev/null
          helm template t charts/homelab-autodoc -n homelab-autodoc \
            --set server.existingSecret=x \
            --set server.gatewayApi.enabled=true \
            --set server.gatewayApi.parentRef.name=my-gw \
            --set server.gatewayApi.parentRef.namespace=gw-ns > /dev/null
          helm template t charts/homelab-autodoc -n homelab-autodoc \
            --set server.enabled=false \
            --set collector.pushUrl=http://autodoc-server.other.svc:8000 > /dev/null
      - name: Fail-fast guards raise a clear error
        run: |
          set -e
          out=$(helm template t charts/homelab-autodoc -n homelab-autodoc 2>&1) && { echo "expected server.existingSecret guard did not fire"; exit 1; }
          echo "$out" | grep -q "server.existingSecret is required"
          out=$(helm template t charts/homelab-autodoc -n homelab-autodoc --set server.existingSecret=x --set server.enabled=false 2>&1) && { echo "expected collector.pushUrl guard did not fire"; exit 1; }
          echo "$out" | grep -q "collector.pushUrl is required"

  test-frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      # vitest's coverage-summary.json has a different shape than coverage.py's -
      # reshape just the number the badge script needs, same script for every package.
      - run: |
          python3 -c "
          import json
          pct = json.load(open('coverage/coverage-summary.json'))['total']['lines']['pct']
          json.dump({'totals': {'percent_covered': pct}}, open('coverage-for-badge.json', 'w'))
          "
        working-directory: frontend
      - run: python3 ../scripts/generate_coverage_badge.py coverage-for-badge.json coverage-badge.json frontend
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-badge-frontend
          path: frontend/coverage-badge.json
          retention-days: 7

  # ---------------------------------------------------------------------
  # Version / docker / release — push to master only
  # ---------------------------------------------------------------------
  get-version:
    needs: [test-lint, test-unit, test-frontend-lint, test-frontend-unit, test-helm-lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # @semantic-release/github's verifyConditions checks repo push access even during a dry
    # run, so contents: write is required here too.
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.semrel.outputs.new_release_version }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@6.0.3
            @semantic-release/github@12.0.9
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - expected, not a failure." | tee -a "$GITHUB_STEP_SUMMARY"

  docker-smoke-check:
    # Runs after semantic-release so it builds from the same tree that's about to be tagged,
    # same as the docker jobs below. collector has no HTTP surface at all (a CLI, not a
    # service) - "smoke-check" there just means the image runs and the entry point works.
    needs: [get-version, semantic-release]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [collector, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          load: true
          tags: homelab-autodoc-${{ matrix.image }}:smoke-check
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
      - name: Smoke-check collector
        if: matrix.image == 'collector'
        run: docker run --rm homelab-autodoc-collector:smoke-check --version
      - name: Smoke-check server
        if: matrix.image == 'server'
        run: |
          docker run -d --name server-smoke -p 8000:8000 -e AUTODOC_SESSION_SECRET=smoke-check homelab-autodoc-server:smoke-check
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "container is healthy"
              docker rm -f server-smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy in time"
          docker logs server-smoke
          docker rm -f server-smoke
          exit 1

  docker-build-push:
    # One native runner per platform instead of a single QEMU-emulated multi-platform build -
    # ubuntu-24.04-arm is a real arm64 GitHub-hosted runner (free for public repos), so that
    # leg builds at native speed. Each leg pushes its own image by digest only (no tag yet);
    # docker-manifest-merge below stitches the two digests per image into the actual
    # multi-arch :latest/:$NEXT_VERSION tags.
    needs: [get-version, semantic-release, docker-smoke-check]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    strategy:
      fail-fast: true
      matrix:
        image: [collector, server]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
      IMAGE: ghcr.io/lukislp/homelab-autodoc-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    needs: [get-version, docker-build-push]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    strategy:
      fail-fast: true
      matrix:
        image: [collector, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
      IMAGE: ghcr.io/lukislp/homelab-autodoc-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"

  trivy-scan:
    needs: [get-version, docker-manifest-merge]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [collector, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
      IMAGE: ghcr.io/lukislp/homelab-autodoc-${{ matrix.image }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

  semantic-release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-badge-*
          path: coverage-artifacts
      - run: |
          mkdir -p .github/badges
          for pkg in core collector generator server frontend; do
            mv "coverage-artifacts/coverage-badge-$pkg/coverage-badge.json" ".github/badges/coverage-$pkg.json"
          done
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@6.0.3
            @semantic-release/github@12.0.9
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
