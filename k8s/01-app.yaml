# Flux-managed via k8s/flux-deploy/kustomization.yaml (which applies exactly this file - the
# same PVC+Deployment+Service subset the shared homelab-infra kustomize-controller RBAC already
# permits for every sibling app). k8s/flux/ wires this repo into Flux itself. Everything else in
# k8s/ (00-namespace.yaml/02-httproute.yaml/03-network-policies.yaml/03-collector-rbac.yaml/
# 04-collector-cronjob.yaml) stays bootstrap-only, applied by hand - see k8s/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autodoc-server-data
  namespace: homelab-autodoc
spec:
  # ReadWriteMany + Longhorn (NFS-backed share-manager, cross-node-replicated, see
  # homelab-infra/cluster/11-longhorn-values.yaml) instead of local-path's RWO. local-path's
  # RWO was only node-scoped (enforced via the PV's own nodeAffinity, not pod-exclusive),
  # which is what let the surge pod mount concurrently with the outgoing one during a
  # RollingUpdate. Longhorn's RWO enforces true single-pod-exclusive, which would break that
  # overlap - RWX replicates the same concurrent-mount behavior properly (even across nodes).
  accessModes: ["ReadWriteMany"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autodoc-server-config
  namespace: homelab-autodoc
spec:
  # Same RWX reasoning as autodoc-server-data above - same Deployment, same RollingUpdate.
  accessModes: ["ReadWriteMany"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodoc-server
  namespace: homelab-autodoc
  labels: {app: autodoc-server}
spec:
  # /data and /config are ReadWriteOnce - stay single-replica. Surge-style RollingUpdate is
  # still safe despite RWO: local-path PVs carry node affinity, so the replacement pod always
  # schedules onto the node already holding the volumes, and RWO is a per-NODE restriction -
  # two pods on the same node can mount it during the handover. maxUnavailable 0 keeps the old
  # pod serving until the new one is Ready (its startup rebuild takes ~1min with LLM prose),
  # instead of the ~1min "temporarily unavailable" every Flux image bump used to cause under
  # Recreate. The brief two-writer overlap is harmless: /data is only written on inventory
  # pushes and deletes, which the Service keeps routing to the old (only Ready) pod.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: autodoc-server}
  template:
    metadata:
      labels: {app: autodoc-server}
      annotations:
        # Opt-in to homelab-infra's nightly Velero PVC backup (cluster/10-velero-values.yaml
        # there): /data holds the changelog + drift history nothing can reconstruct, /config
        # the admin/auth setup. Both files are written atomically or append-only, so the
        # file-system backup needs no pre-hook here.
        backup.velero.io/backup-volumes: data,config
    spec:
      serviceAccountName: default
      initContainers:
        # The PVCs' existing files were written by the image's root era;
        # chown on every start (idempotent, and this data is tiny) so the
        # non-root server below can keep rewriting them. The only root in
        # the pod - the server container itself never gets it.
        - name: fix-volume-ownership
          image: busybox:1.38.0
          command: ["chown", "-R", "10001:10001", "/data", "/config"]
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      containers:
        - name: server
          image: ghcr.io/lukislp/homelab-autodoc-server:1.52.21 # set by the deploy-bump job (CI) on every release
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # Nothing in the image layer needs to survive a restart: /data and /config are
            # PVCs and the three writable paths below are all regenerated on startup.
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8000
          env:
            # Create first (see k8s/README.md for the full bootstrap secret command):
            # kubectl -n homelab-autodoc create secret generic autodoc-server-secrets
            #   --from-literal=session-secret=$(openssl rand -base64 32)
            #   --from-literal=openai-api-key=<same key studylife-ai uses>
            - name: AUTODOC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: autodoc-server-secrets
                  key: session-secret
            # Same model studylife-ai settled on (see its docs/decisions.md): cheaper and faster
            # than gpt-4o/gpt-5-mini, plenty for a short factual summary - no reasoning needed here.
            - name: AUTODOC_LLM_MODEL
              value: "openai/gpt-5.6-luna"
            - name: AUTODOC_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autodoc-server-secrets
                  key: openai-api-key
            # Reasoning models bill hidden "thinking" tokens even for a trivial reply if this is
            # left unset (found in studylife-ai). Same value as studylife-ai's LLM_MODEL uses -
            # "minimal" looked more fitting for this much simpler prompt but crashed server
            # startup: litellm.UnsupportedParamsError, gpt-5.6-luna doesn't support it
            # (litellm.get_model_info: supports_minimal_reasoning_effort=False). "medium" is
            # proven working and the cost difference is negligible either way.
            - name: AUTODOC_LLM_REASONING_EFFORT
              value: "medium"
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            # HOME of the autodoc user (set in server/Dockerfile), so any library cache
            # write lands here.
            - name: tmp
              mountPath: /tmp
            # AUTODOC_DOCS_DIR and the mkdocs site_dir next to it: rebuild_all_sites
            # regenerates both from /data on startup and on every push, which is exactly why
            # the Dockerfile made them the only app-user-writable trees in the image. With a
            # read-only root they need real volumes; emptyDir keeps them ephemeral, as before.
            - name: docs-src
              mountPath: /app/server/docs_src
            - name: site
              mountPath: /app/server/site
          # The server only starts listening after its import-time
          # rebuild_all_sites (LLM prose for every cluster - roughly a minute
          # today, growing with cluster count). The startupProbe gives that up
          # to 7.5 minutes before liveness takes over; without it, liveness
          # (3 failures x 30s) can kill a slow-starting container mid-rebuild.
          #
          # Every probe sets timeoutSeconds explicitly. The Kubernetes default of 1s is too
          # tight for the arm64 Raspberry Pi nodes this runs on: the weakest node sits close
          # to its memory limit, so an ordinary load spike pushes /healthz past one second,
          # the liveness probe fails failureThreshold times in a row and kubelet restarts the
          # container. A 5s budget tells a busy pod apart from a dead one. The startup probe
          # keeps a period longer than that timeout, and its total budget only grew.
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 45
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: autodoc-server-data}
        - name: config
          persistentVolumeClaim: {claimName: autodoc-server-config}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: docs-src
          emptyDir: {sizeLimit: 128Mi}
        # The generated site is the big one - mkdocs-material's assets alone put the current
        # build at ~20Mi, so leave clear headroom for more clusters.
        - name: site
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: autodoc-server
  namespace: homelab-autodoc
spec:
  type: ClusterIP
  selector: {app: autodoc-server}
  ports:
    - port: 8000
      targetPort: 8000
