# Flux-managed via k8s/flux-deploy/kustomization.yaml (which applies exactly this file - the
# same PVC+Deployment+Service subset the shared homelab-infra kustomize-controller RBAC already
# permits for every sibling app). k8s/flux/ wires this repo into Flux itself. Everything else in
# k8s/ (00-namespace.yaml/02-httproute.yaml/03-network-policies.yaml/03-collector-rbac.yaml/
# 04-collector-cronjob.yaml) stays bootstrap-only, applied by hand - see k8s/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autodoc-server-data
  namespace: homelab-autodoc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autodoc-server-config
  namespace: homelab-autodoc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodoc-server
  namespace: homelab-autodoc
  labels: {app: autodoc-server}
spec:
  # /data and /config are ReadWriteOnce - stay single-replica. Recreate (not RollingUpdate) so a
  # rollout never has two pods fighting over the same RWO volumes.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: autodoc-server}
  template:
    metadata:
      labels: {app: autodoc-server}
    spec:
      serviceAccountName: default
      containers:
        - name: server
          # Once onboarded into the central studylife repo's Flux pattern, an
          # ImageUpdateAutomation there would auto-bump this tag - the marker is left in place
          # ready for that, even though nothing acts on it yet.
          image: ghcr.io/lukislp/homelab-autodoc-server:1.9.0 # {"$imagepolicy": "flux-system:homelab-autodoc-server"}
          ports:
            - containerPort: 8000
          env:
            # Create first: kubectl -n homelab-autodoc create secret generic
            # autodoc-server-secrets --from-literal=session-secret=$(openssl rand -base64 32)
            - name: AUTODOC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: autodoc-server-secrets
                  key: session-secret
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: autodoc-server-data}
        - name: config
          persistentVolumeClaim: {claimName: autodoc-server-config}
---
apiVersion: v1
kind: Service
metadata:
  name: autodoc-server
  namespace: homelab-autodoc
spec:
  type: ClusterIP
  selector: {app: autodoc-server}
  ports:
    - port: 8000
      targetPort: 8000
