# Persists the device-grant push token across runs, so only the very first run ever needs an
# admin to approve it - see collector/README.md and k8s/README.md#token-persistence for why a
# PVC and not a Secret. Flux-managed since the shared reconciler ClusterRole gained
# batch/cronjobs (homelab-infra flux/01-reconciler-rbac.yaml): part of the
# k8s/flux-deploy/ subset, with image automation bumping the marker below - the manual
# collector bump repeatedly lagged behind the Flux-automated server, leaving mismatched
# versions between bumps.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autodoc-collector-token
  namespace: homelab-autodoc
spec:
  accessModes: ["ReadWriteOnce"]
  # Intentionally tiny - this holds one token, nothing else. Pinned to Longhorn (cross-node-
  # replicated, see homelab-infra/cluster/11-longhorn-values.yaml) rather than the cluster
  # default - trades away the "portable across any k3s install" property this had with no
  # storageClassName set, in exchange for surviving a node dying without re-approving the
  # device grant. No RWX needed here (unlike autodoc-server-data/-config) - this is a
  # sequential CronJob (concurrencyPolicy: Forbid), never two pods at once.
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: autodoc-collector
  namespace: homelab-autodoc
  annotations:
    # The token PVC can't join the Velero file-system backup: FSB needs a
    # running pod and this job lives for about a minute a night. Losing the
    # token costs one device-grant approval click - accepted.
    autodoc.homelab/accept-no-backup: >-
      file-system backup needs a running pod and the collector job lives about a minute a night; losing the cached token costs one device-grant approval click
spec:
  schedule: "0 2 * * *" # nightly at 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: autodoc-collector
          restartPolicy: Never
          # fsGroup replaces the former root chown init container: the kubelet
          # sets group ownership + group rw on the token volume at mount time
          # (OnRootMismatch: only when it actually differs, e.g. the file the
          # image's root era left behind), so the whole pod satisfies the
          # restricted PodSecurity profile - no container needs root anymore.
          securityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: collector
              image: ghcr.io/lukislp/homelab-autodoc-collector:1.51.1 # {"$imagepolicy": "flux-system:homelab-autodoc-collector"}
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              args:
                - --push
                - http://autodoc-server.homelab-autodoc.svc.cluster.local:8000
                - --token-file
                - /var/run/autodoc/token
              env:
                # Override per cluster (Kustomize patch or a separate overlay) -
                # this placeholder is only correct for a single-cluster setup.
                - name: CLUSTER_NAME
                  value: homelab
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: 500m, memory: 256Mi}
              volumeMounts:
                - name: token
                  mountPath: /var/run/autodoc
          volumes:
            - name: token
              persistentVolumeClaim:
                claimName: autodoc-collector-token
