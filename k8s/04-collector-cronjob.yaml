# Persists the device-grant push token across runs, so only the very first run ever needs an
# admin to approve it - see collector/README.md and k8s/README.md#token-persistence for why a
# PVC and not a Secret. Flux-managed since the shared reconciler ClusterRole gained
# batch/cronjobs (homelab-infra flux/01-reconciler-rbac.yaml): part of the
# k8s/flux-deploy/ subset, with image automation bumping the marker below - the manual
# collector bump repeatedly lagged behind the Flux-automated server, leaving mismatched
# versions between bumps.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autodoc-collector-token
  namespace: homelab-autodoc
spec:
  accessModes: ["ReadWriteOnce"]
  # Intentionally tiny - this holds one token, nothing else. Uses the
  # cluster's default StorageClass (no storageClassName set) so this stays
  # portable across k3s installs instead of hardcoding e.g. local-path.
  resources:
    requests:
      storage: 10Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: autodoc-collector
  namespace: homelab-autodoc
spec:
  schedule: "0 2 * * *" # nightly at 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: autodoc-collector
          restartPolicy: Never
          initContainers:
            # The cached push token was written by the image's root era;
            # chown on every run (idempotent, one tiny file) so the
            # non-root collector below can keep rewriting it.
            - name: fix-token-ownership
              image: busybox:1.36.1
              command: ["chown", "-R", "10001:10001", "/var/run/autodoc"]
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: token
                  mountPath: /var/run/autodoc
          containers:
            - name: collector
              image: ghcr.io/lukislp/homelab-autodoc-collector:1.45.1 # {"$imagepolicy": "flux-system:homelab-autodoc-collector"}
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              args:
                - --push
                - http://autodoc-server.homelab-autodoc.svc.cluster.local:8000
                - --token-file
                - /var/run/autodoc/token
              env:
                # Override per cluster (Kustomize patch or a separate overlay) -
                # this placeholder is only correct for a single-cluster setup.
                - name: CLUSTER_NAME
                  value: homelab
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: 500m, memory: 256Mi}
              volumeMounts:
                - name: token
                  mountPath: /var/run/autodoc
          volumes:
            - name: token
              persistentVolumeClaim:
                claimName: autodoc-collector-token
