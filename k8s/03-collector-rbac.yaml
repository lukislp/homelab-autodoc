# Read-only access for the autodoc-collector.
#
# Grants get/list/watch on exactly the resource kinds the collector reads -
# nothing else, no write verbs anywhere. Cluster-scoped because the collector
# inventories every application namespace in one run.
#
# Bootstrap-only, NOT Flux-managed: the central studylife repo's kustomize-controller RBAC
# (06-reconciler-rbac.yaml) can create ClusterRole/ClusterRoleBinding objects, but Kubernetes'
# privilege-escalation check blocks it from creating one granting permissions it doesn't itself
# hold - and it currently has no read access to "namespaces" or "ingresses" at all. Onboarding
# this would mean adding those to the central RBAC first, same as every prior addition there
# (see that file's own history for the pattern). See k8s/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autodoc-collector
  namespace: homelab-autodoc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autodoc-collector
rules:
  - apiGroups: [""]
    resources:
      [
        "namespaces",
        "services",
        "persistentvolumeclaims",
        "pods",
        "nodes",
        "resourcequotas",
        "limitranges",
      ]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  # Gateway API - safe to grant even on a cluster that doesn't have this CRD
  # installed at all: RBAC rules for a resource type the API server doesn't
  # know about are simply inert, never an error (the collector's own 404
  # handling is what actually makes it cluster-invariant).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autodoc-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: autodoc-collector
subjects:
  - kind: ServiceAccount
    name: autodoc-collector
    namespace: homelab-autodoc
