# Default-deny ingress baseline for the whole namespace; egress stays open (the server calls out
# to whichever OAuth/OIDC provider and LLM API the admin configures at setup time - no fixed
# egress allowlist makes sense here). Same strategy as the sibling apps' own network-policies
# files.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: homelab-autodoc
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: homelab-autodoc
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - {} # egress otherwise unrestricted - this policy only adds an explicit DNS allowance
---
# Lets the Gateway (NGF data plane, k8s/02-httproute.yaml) reach the server pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-gateway-to-autodoc-server
  namespace: homelab-autodoc
spec:
  podSelector: { matchLabels: { app: autodoc-server } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: nginx-gateway } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# The collector CronJob's own pods never receive inbound traffic (nothing calls into them - they
# only make outbound calls to the k8s API server and to autodoc-server), but default-deny-ingress
# above blocks ALL ingress including same-namespace traffic, so the collector's outbound push to
# autodoc-server needs its own explicit allow too - a podSelector with no namespaceSelector means
# "any pod in this namespace", which is what actually reached this the hard way: found live, the
# first real collector run got a plain connection-refused pushing to the server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-collector-to-autodoc-server
  namespace: homelab-autodoc
spec:
  podSelector: { matchLabels: { app: autodoc-server } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8000 }
