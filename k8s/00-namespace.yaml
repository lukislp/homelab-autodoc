# Not wired into the central studylife repo's Flux GitOps pattern yet - this whole deployment
# is bootstrap-only for now (applied by hand), same convention the sibling apps use for their
# own Namespace/RBAC manifests before/unless they get onboarded into Flux.
apiVersion: v1
kind: Namespace
metadata:
  name: homelab-autodoc
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: homelab-autodoc
automountServiceAccountToken: false
