# Scans GHCR for new tags of the server and collector images (.github/workflows/ci-cd.yml
# "docker-build-push" job, matrix image=server|collector - one release version tags both).
# Public packages - no secretRef needed.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: homelab-autodoc-server
  namespace: flux-system
spec:
  image: ghcr.io/lukislp/homelab-autodoc-server
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: homelab-autodoc-collector
  namespace: flux-system
spec:
  image: ghcr.io/lukislp/homelab-autodoc-collector
  interval: 5m
