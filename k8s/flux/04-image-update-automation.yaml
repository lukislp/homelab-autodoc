# Automatically commits new image tags to master (directly, no PR). Patches ONLY the marker
# comments - the server's in k8s/01-app.yaml and the collector's in
# k8s/04-collector-cronjob.yaml - not the rest of k8s/. One release version tags both images,
# so both markers move together. "[skip ci]" in the commit template is MANDATORY -
# without it, a plain image-tag commit (no app code changed) would still trigger the entire CI
# pipeline again for no reason. Affects ONLY the CI trigger, not Flux's own reconciliation
# (which watches the Git ref directly).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: homelab-autodoc-server
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-autodoc
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: flux@studylife.local
        name: fluxcdbot
      messageTemplate: |
        chore(image): auto-update [skip ci]
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{- range $_, $change := $changes }}
            {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{- end }}
        {{ end -}}
  update:
    path: ./k8s
    strategy: Setters
