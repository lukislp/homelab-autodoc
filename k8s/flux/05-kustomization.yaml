# Applies EXCLUSIVELY k8s/flux-deploy/ (this repo's curated Flux-managed subset: 01-app.yaml,
# the server's PVC+Deployment+Service, plus 04-collector-cronjob.yaml - see that folder's own
# kustomization.yaml). The reconciler side (homelab-infra's flux/01-reconciler-rbac.yaml)
# covers all resource kinds used here; batch/cronjobs was added there specifically for the
# collector.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-autodoc-deploy
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-autodoc
  path: ./k8s/flux-deploy
  prune: true
  wait: true
  timeout: 3m
