# Applies EXCLUSIVELY k8s/flux-deploy/ (this repo's curated Flux-managed subset - currently just
# 01-app.yaml, the server's PVC+Deployment+Service - see that folder's own kustomization.yaml).
# No RBAC changes needed on the reconciler side (homelab-infra's flux/01-reconciler-rbac.yaml) -
# the resource kinds used here (PersistentVolumeClaim/Service/Deployment) are already covered by
# the existing shared ClusterRole.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-autodoc-deploy
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-autodoc
  path: ./k8s/flux-deploy
  prune: true
  wait: true
  timeout: 3m
