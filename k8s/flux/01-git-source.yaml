# Points Flux at this repo. Needs write access (not just read), since
# image-automation-controller pushes commits for new image tags directly to master (see
# 04-image-update-automation.yaml). Reuses the cluster-wide "studylife-git-auth" secret
# (flux-system namespace, managed in the homelab-infra repo) rather than a repo-specific one -
# same trade-off every sibling app repo already accepts: one shared credential across the
# cluster, acceptable for a personal homelab, not something a stricter multi-tenant setup
# should copy without reconsidering.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-autodoc
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/lukislp/homelab-autodoc.git
  ref:
    branch: master
  secretRef:
    name: studylife-git-auth
