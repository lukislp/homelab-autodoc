apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autodoc-server-data
  namespace: autodoc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autodoc-server-config
  namespace: autodoc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodoc-server
  namespace: autodoc
spec:
  # /data and /config are ReadWriteOnce - stay single-replica. Recreate
  # (not RollingUpdate) so a rollout never has two pods fighting over the
  # same RWO volumes.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autodoc-server
  template:
    metadata:
      labels:
        app: autodoc-server
    spec:
      containers:
        - name: server
          image: ghcr.io/lukislp/homelab-autodoc-server:latest
          ports:
            - containerPort: 8000
          env:
            # Create first: kubectl -n autodoc create secret generic
            # autodoc-server-secrets --from-literal=session-secret=$(openssl rand -base64 32)
            - name: AUTODOC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: autodoc-server-secrets
                  key: session-secret
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autodoc-server-data
        - name: config
          persistentVolumeClaim:
            claimName: autodoc-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: autodoc-server
  namespace: autodoc
spec:
  selector:
    app: autodoc-server
  ports:
    - port: 8000
      targetPort: 8000
