[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodoc-collector"
version = "1.4.0"
description = "Read-only Kubernetes inventory collector for homelab-autodoc"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "autodoc-core>=0.1.0",
    "kubernetes>=30.1.0",
]

[project.scripts]
autodoc-collector = "autodoc_collector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodoc_collector"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
