[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodoc-generator"
version = "1.52.4"
description = "Turns a homelab-autodoc inventory into a Markdown documentation site"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "autodoc-core>=0.1.0",
    "Jinja2>=3.1.0",
    "litellm>=1.40.0",
]

[project.scripts]
autodoc-generator = "autodoc_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodoc_generator"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
