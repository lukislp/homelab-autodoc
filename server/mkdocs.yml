site_name: homelab-autodoc
docs_dir: docs_src
site_dir: site
theme:
  name: material
  custom_dir: overrides
  # Material's own font loading is disabled - overrides/main.html links the
  # three custom fonts directly (client-fetched, see that file's comment for
  # why), so Material's default Roboto/Roboto Mono link would just be an
  # unused, wasted request.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  # Unlike Material's own bundled assets (content-hashed filenames, e.g.
  # main.ec1eaa64.min.js - the hash changes automatically whenever the
  # content does, which forces browsers/proxies to fetch fresh), these files
  # keep the exact same filename across every release. A ?v= query string is
  # a manual stand-in for that: bump it whenever one of these files changes,
  # so a stale cached copy under a proxy or browser cache can never look like
  # this feature is broken when it's actually just serving old JS.
  - javascripts/mermaid-pan-zoom.js?v=8
  - javascripts/auto-refresh.js?v=1
  - javascripts/freshness.js?v=1
extra_css:
  - stylesheets/mermaid-pan-zoom.css?v=11
  - stylesheets/theme.css?v=2
  - stylesheets/hub-nav.css?v=11
