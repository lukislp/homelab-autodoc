site_name: homelab-autodoc
docs_dir: docs_src
site_dir: site
theme:
  name: material
  features:
    # With 14+ namespaces (each its own top-level nav entry, several with many
    # apps) the full nav tree overflowed the viewport - prune renders only the
    # current page's own path instead of every namespace's subtree at once.
    - navigation.prune
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
