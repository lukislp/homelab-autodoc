site_name: homelab-autodoc
docs_dir: docs_src
site_dir: site
theme:
  name: material
  custom_dir: overrides
  features:
    # With 14+ namespaces (each its own top-level nav entry, several with many
    # apps) the full nav tree overflowed the viewport - prune renders only the
    # current page's own path instead of every namespace's subtree at once.
    - navigation.prune
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  # Vendored, not CDN-loaded: autodoc.heim.lan is an internal-only hostname -
  # a homelab network's egress to external CDNs isn't guaranteed, and this
  # script failing to load must never be a silent, hard-to-diagnose reason
  # pan-zoom just doesn't work.
  #
  # Unlike Material's own bundled assets (content-hashed filenames, e.g.
  # main.ec1eaa64.min.js - the hash changes automatically whenever the
  # content does, which forces browsers/proxies to fetch fresh), these files
  # keep the exact same filename across every release. A ?v= query string is
  # a manual stand-in for that: bump it whenever one of these files changes,
  # so a stale cached copy under a proxy or browser cache can never look like
  # this feature is broken when it's actually just serving old JS.
  - javascripts/svg-pan-zoom.min.js?v=2
  - javascripts/mermaid-pan-zoom.js?v=2
extra_css:
  - stylesheets/mermaid-pan-zoom.css?v=2
  - stylesheets/sidebar-scroll.css?v=2
