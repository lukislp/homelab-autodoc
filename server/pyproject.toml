[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodoc-server"
version = "1.42.2"
description = "Receives pushed cluster inventories and serves the homelab-autodoc site"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "autodoc-core>=0.1.0",
    "autodoc-generator>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
]

[project.scripts]
autodoc-server = "autodoc_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodoc_server"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...)-as-default-argument is the standard idiom, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
